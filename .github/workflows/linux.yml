name: Linux AppImage

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with OBS_VERSION in scripts/build-obs-linux.sh (part of the cache key).
  OBS_VERSION: '32.1.0'

jobs:
  appimage:
    name: OBS from source + AppImage (ubuntu-24.04, x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # The OBS build (~30-45 min) only reruns when the OBS tag or the build script changes.
      - name: Restore OBS build cache
        id: obs-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/obs/linux
          key: obs-linux-${{ env.OBS_VERSION }}-ubuntu-24.04-x64-${{ hashFiles('scripts/build-obs-linux.sh') }}

      - name: Free disk space for the OBS build
        if: steps.obs-cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build OBS ${{ env.OBS_VERSION }} from source
        if: steps.obs-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-obs-linux.sh

      - name: Remove OBS build intermediates
        if: steps.obs-cache.outputs.cache-hit != 'true'
        run: rm -rf vendor/cache

      # Saved right away so a later failure (tests, packaging) does not throw the OBS build away.
      - name: Save OBS build cache
        if: steps.obs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor/obs/linux
          key: ${{ steps.obs-cache.outputs.cache-primary-key }}

      - name: Check staged OBS tree
        run: |
          test -x vendor/obs/linux/obs/bin/obs
          test -f vendor/obs/linux/obs/COPYING
          test -f vendor/obs/linux/obs/lib/obs-plugins/obs-browser.so
          test -f vendor/obs/linux/obs/lib/obs-plugins/obs-websocket.so
          cat vendor/obs/linux/obs/BUILD-INFO.txt
          du -sh vendor/obs/linux/obs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure the Electron binary is present
        run: test -x node_modules/electron/dist/electron || node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build AppImage
        run: npm run dist:linux

      - name: Inspect AppImage
        run: |
          set -euo pipefail
          appimage="$(ls dist/*.AppImage)"
          echo "AppImage: $appimage ($(du -h "$appimage" | cut -f1))"
          rm -rf /tmp/appimage && mkdir -p /tmp/appimage && cd /tmp/appimage
          "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          obs=/tmp/appimage/squashfs-root/resources/obs/bin/obs
          test -x "$obs"
          test -f /tmp/appimage/squashfs-root/resources/obs/COPYING
          test -f /tmp/appimage/squashfs-root/resources/obs/SOURCE.md
          if ldd "$obs" | grep 'not found'; then exit 1; fi
          echo "OBS_EXTRACTED=$obs" >> "$GITHUB_ENV"

      # Best-effort smoke test: start/stop the bundled OBS under Xvfb (software GL) through the
      # real ObsProcess, isolated config. Informational only: CI has no GPU, audio or camera.
      - name: Smoke test bundled OBS (Xvfb)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
          LINTO_LIVE_IT=1 LINTO_LIVE_OBS="$OBS_EXTRACTED" \
            xvfb-run -a -s '-screen 0 1920x1080x24' \
            npx vitest run --config vitest.it.config.ts tests/integration/obs-process.it.test.ts

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: LinTO-Live-linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  checks-macos:
    name: Typecheck + unit tests (macos-14)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
