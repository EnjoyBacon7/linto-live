name: Build

# Pull requests, pushes to main, tags v* and manual runs. Jobs run in parallel where they can:
#   checks             typecheck + unit tests (Linux)
#   obs-linux          makes sure the OBS build cache exists (builds OBS only on a cache miss)
#   linux-appimage-deb AppImage + .deb, installed and inspected, OBS smoke test
#   linux-flatpak      Flatpak (its `flatpak build-bundle` is the slowest step, ~7 min)
#   flatpak-ubuntu-2204  the Flatpak installed on Ubuntu 22.04
#   macos              typecheck + tests, official OBS smoke test; the dmg on tags and manual runs
# apt downloads (.github/actions/apt-cache), the OBS compiler cache (ccache) and electron-builder's
# downloads are cached: the runners' Ubuntu mirror is sometimes very slow.
# Tags v*: then a GitHub release with all four packages, SHA256SUMS.txt and the notes from
# CHANGELOG.md (scripts/release-notes.sh).

on:
  # Branches are built through their pull request only (no duplicate push + pull_request runs).
  push:
    branches: [main]
    tags: ['v*']
    # Not evaluated for tag pushes, so releases always build.
    paths-ignore: ['docs/**', 'spikes/**', '**/*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', 'spikes/**', '**/*.md', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # Keep in sync with OBS_VERSION in scripts/build-obs-linux.sh (part of the cache key).
  OBS_VERSION: '32.1.0'
  # Keep in sync with flatpak.runtimeVersion / baseVersion in electron-builder.yml.
  FLATPAK_RUNTIME: '25.08'

jobs:
  checks:
    name: Typecheck + unit tests (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ensure the Electron binary is present
        run: test -x node_modules/electron/dist/electron || node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm test

  # The OBS build only reruns when the OBS tag, the build script or the patches change. On a cache
  # hit this job only looks the key up (a few seconds); the packaging jobs then restore it. On a miss,
  # ccache recompiles only what the change touched (~3.5 min for a full compile).
  obs-linux:
    name: OBS build cache (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      key: ${{ steps.obs-cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v4

      - name: Look up OBS build cache
        id: obs-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/obs/linux
          key: obs-linux-${{ env.OBS_VERSION }}-ubuntu-24.04-x64-${{ hashFiles('scripts/build-obs-linux.sh', 'scripts/obs-linux-patches/**') }}
          lookup-only: true

      # The runner has ~70 GB free, far more than the build needs: no disk clean-up (it took ~2 min).
      - name: Cache apt downloads
        if: steps.obs-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/apt-cache
        with:
          key: obs-build

      # Keyed by run: a miss always saves the updated cache; the newest one is restored.
      - name: Cache compiler output (ccache)
        if: steps.obs-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-obs-linux-${{ env.OBS_VERSION }}-${{ github.run_id }}
          restore-keys: ccache-obs-linux-${{ env.OBS_VERSION }}-

      # ccache goes in through CMake's launcher variables, so the script (and the OBS cache key)
      # stay unchanged. OBS's CMake uses precompiled headers: ccache needs the pch sloppiness.
      - name: Build OBS ${{ env.OBS_VERSION }} from source
        if: steps.obs-cache.outputs.cache-hit != 'true'
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
        run: |
          # ccache itself comes with the script's build dependencies; the restored counters are
          # dropped by hand so the stats below are this build's.
          export CCACHE_DIR="$HOME/.ccache" CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          find "$CCACHE_DIR" -name stats -type f -delete 2>/dev/null || true
          bash scripts/build-obs-linux.sh
          ccache --show-stats
          rm -rf vendor/cache

      - name: Save OBS build cache
        if: steps.obs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor/obs/linux
          key: ${{ steps.obs-cache.outputs.cache-primary-key }}

  linux-appimage-deb:
    name: AppImage + .deb (ubuntu-24.04, x64)
    needs: [obs-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore OBS build
        uses: actions/cache/restore@v4
        with:
          path: vendor/obs/linux
          key: ${{ needs.obs-linux.outputs.key }}
          fail-on-cache-miss: true

      - name: Check staged OBS tree
        run: |
          test -x vendor/obs/linux/obs/bin/obs
          test -f vendor/obs/linux/obs/COPYING
          test -f vendor/obs/linux/obs/lib/obs-plugins/obs-browser.so
          test -f vendor/obs/linux/obs/lib/obs-plugins/obs-websocket.so
          cat vendor/obs/linux/obs/BUILD-INFO.txt
          du -sh vendor/obs/linux/obs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Electron zip + electron-builder's tools (AppImage runtime, fpm, 7-Zip, ...): ~30-60 s to fetch.
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-builder-appimage-deb-${{ hashFiles('package-lock.json', 'electron-builder.yml') }}
          restore-keys: electron-builder-appimage-deb-

      - name: Build AppImage + .deb
        run: npm run dist:linux:nopak

      - name: Cache apt downloads
        uses: ./.github/actions/apt-cache
        with:
          key: deb-install

      # The bundled OBS leaves host libraries (libva, PulseAudio, EGL/GL, ...) to the system; the
      # .deb declares them. Installing it with apt pulls them in, so `ldd` checks both the OBS tree
      # and the package's Depends list.
      - name: Install and inspect .deb
        run: |
          set -euo pipefail
          deb="$(ls dist/*.deb)"
          dpkg-deb --info "$deb"
          # Listed to a file: grep -q on the pipe would stop early and fail dpkg-deb under pipefail.
          dpkg-deb --contents "$deb" > /tmp/deb-contents.txt
          grep 'resources/obs/bin/obs$' /tmp/deb-contents.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "./$deb" xvfb libgl1-mesa-dri
          obs="/opt/LinTO Live/resources/obs/bin/obs"
          test -x "$obs"
          if ldd "$obs" | grep 'not found'; then exit 1; fi
          echo "OBS_INSTALLED=$obs" >> "$GITHUB_ENV"

      - name: Inspect AppImage
        run: |
          set -euo pipefail
          appimage="$(ls dist/*.AppImage)"
          echo "AppImage: $appimage ($(du -h "$appimage" | cut -f1))"
          # Static type2 runtime (toolsets.appimage): Ubuntu 24.04+ has no libfuse2.
          if ldd "$appimage" 2>&1 | grep libfuse; then echo "AppImage runtime links libfuse" >&2; exit 1; fi
          "$appimage" --appimage-version
          rm -rf /tmp/appimage && mkdir -p /tmp/appimage && cd /tmp/appimage
          "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          obs=/tmp/appimage/squashfs-root/resources/obs/bin/obs
          test -x "$obs"
          test -f /tmp/appimage/squashfs-root/resources/obs/COPYING
          test -f /tmp/appimage/squashfs-root/resources/obs/SOURCE.md
          if ldd "$obs" | grep 'not found'; then exit 1; fi

      # Best-effort smoke test: start/stop the bundled OBS under Xvfb (software GL) through the
      # real ObsProcess, isolated config. Informational only: CI has no GPU, audio or camera.
      - name: Smoke test bundled OBS (Xvfb)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          LINTO_LIVE_IT=1 LINTO_LIVE_OBS="$OBS_INSTALLED" \
            xvfb-run -a -s '-screen 0 1920x1080x24' \
            npx vitest run --config vitest.it.config.ts tests/integration/obs-process.it.test.ts

      - name: Upload AppImage + .deb
        uses: actions/upload-artifact@v4
        with:
          name: LinTO-Live-linux-x86_64-appimage-deb
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          # Already compressed packages: zipping them again only costs time.
          compression-level: 0

  linux-flatpak:
    name: Flatpak (ubuntu-24.04, x64)
    needs: [obs-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore OBS build
        uses: actions/cache/restore@v4
        with:
          path: vendor/obs/linux
          key: ${{ needs.obs-linux.outputs.key }}
          fail-on-cache-miss: true

      - name: Cache apt downloads
        uses: ./.github/actions/apt-cache
        with:
          key: flatpak-build

      - name: Install Flatpak tooling and runtimes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            "org.freedesktop.Platform//$FLATPAK_RUNTIME" \
            "org.freedesktop.Sdk//$FLATPAK_RUNTIME" \
            "org.electronjs.Electron2.BaseApp//$FLATPAK_RUNTIME"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Electron zip + electron-builder's tools (AppImage runtime, fpm, 7-Zip, ...): ~30-60 s to fetch.
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-builder-flatpak-${{ hashFiles('package-lock.json', 'electron-builder.yml') }}
          restore-keys: electron-builder-flatpak-

      - name: Build Flatpak
        run: DEBUG=@malept/flatpak-bundler npm run dist:linux:flatpak

      # Every library the bundled OBS and its plugins link against must resolve inside the sandbox
      # (bundled tree + Freedesktop runtime).
      - name: Install and inspect Flatpak
        run: |
          set -euo pipefail
          bundle="$(ls dist/*.flatpak)"
          echo "Flatpak: $bundle ($(du -h "$bundle" | cut -f1))"
          flatpak install --user -y --noninteractive --bundle "$bundle"
          flatpak info --user ai.linto.live
          flatpak info --user --show-permissions ai.linto.live
          flatpak run --command=sh ai.linto.live -c '
            set -eu
            cd /app/lib/ai.linto.live/resources/obs
            test -x bin/obs && test -f COPYING && test -f SOURCE.md
            missing=0
            for f in bin/obs lib/obs-plugins/*.so; do
              if ldd "$f" | grep "not found"; then echo "^ in $f"; missing=1; fi
            done
            exit $missing
          '

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: LinTO-Live-linux-x86_64-flatpak
          path: dist/*.flatpak
          if-no-files-found: error
          compression-level: 0

  # Ubuntu 22.04 (glibc 2.35) is covered by the Flatpak only: the .deb and AppImage need glibc 2.39,
  # and OBS 32.1 cannot be built there (FFmpeg >= 6.1, CMake >= 3.28). Installs the bundle with the
  # distribution's own flatpak (1.12) and checks every OBS library resolves inside the sandbox.
  flatpak-ubuntu-2204:
    name: Flatpak on Ubuntu 22.04
    needs: [linux-flatpak]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      # Only for the local apt-cache action.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Cache apt downloads
        uses: ./.github/actions/apt-cache
        with:
          key: flatpak-2204

      - uses: actions/download-artifact@v4
        with:
          name: LinTO-Live-linux-x86_64-flatpak
          path: dist

      - name: Install flatpak (Ubuntu 22.04 package) and the bundle
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak
          flatpak --version
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive --bundle "$(ls dist/*.flatpak)"
          flatpak info --user ai.linto.live

      - name: Check permissions and OBS libraries
        run: |
          set -euo pipefail
          perms="$(flatpak info --user --show-permissions ai.linto.live)"
          echo "$perms"
          # Whole entries: "fallback-x11" must not count as "x11".
          grep -Eq '^sockets=(.*;)?wayland;' <<<"$perms"
          grep -Eq '^sockets=(.*;)?x11;' <<<"$perms"
          flatpak run --command=sh ai.linto.live -c '
            set -eu
            cd /app/lib/ai.linto.live/resources/obs
            missing=0
            for f in bin/obs lib/obs-plugins/*.so; do
              if ldd "$f" | grep "not found"; then echo "^ in $f"; missing=1; fi
            done
            exit $missing
          '

      # Best-effort: the app starts and is still running after 20 s under Xvfb. Informational only
      # (no GPU, audio or camera on CI).
      - name: Smoke test app launch (Xvfb)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sudo apt-get install -y --no-install-recommends xvfb dbus-x11
          xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session -- bash -c '
            flatpak run ai.linto.live > /tmp/app.log 2>&1 & pid=$!
            sleep 20
            if kill -0 $pid 2>/dev/null; then echo "still running after 20 s"; rc=0; else echo "exited early"; rc=1; fi
            flatpak kill ai.linto.live 2>/dev/null || kill $pid 2>/dev/null || true
            tail -40 /tmp/app.log
            exit $rc
          '

  macos:
    name: macOS (macos-15, arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The DMG (~150 MB, SHA-256 pinned in the script) is cached: every run can smoke-test OBS.
      - name: Cache official OBS DMG
        uses: actions/cache@v4
        with:
          path: vendor/cache/OBS-Studio-*-macOS-Apple.dmg
          key: obs-macos-${{ env.OBS_VERSION }}-${{ hashFiles('scripts/fetch-obs-macos.sh') }}

      - name: Fetch official OBS ${{ env.OBS_VERSION }} for macOS
        run: npm run fetch:obs:mac

      # Same best-effort smoke test as on Linux: start/stop the official OBS through the real
      # ObsProcess, isolated config (CFFIXED_USER_HOME). Informational only: no camera or audio in CI.
      - name: Smoke test official OBS
        continue-on-error: true
        timeout-minutes: 10
        run: |
          LINTO_LIVE_IT=1 LINTO_LIVE_OBS="$PWD/vendor/obs/macos/OBS.app/Contents/MacOS/OBS" \
            npx vitest run --config vitest.it.config.ts tests/integration/obs-process.it.test.ts

      - name: Build dmg
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: npm run dist:mac

      - name: Inspect dmg
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          app="dist/mac-arm64/LinTO Live.app"
          test -d "$app/Contents/Resources/obs/OBS.app"
          codesign --verify --deep --strict "$app/Contents/Resources/obs/OBS.app"
          hdiutil verify dist/*.dmg
          ls -la dist/*.dmg

      - name: Upload dmg
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: LinTO-Live-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error
          compression-level: 0

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, linux-appimage-deb, linux-flatpak, flatpak-ubuntu-2204, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "v$version" = "$TAG" || { echo "Tag $TAG does not match package.json version $version" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums and notes
        run: |
          set -euo pipefail
          cd release
          for f in "LinTO-Live-$VERSION-arm64.dmg" "LinTO-Live-$VERSION-amd64.deb" \
                   "LinTO-Live-$VERSION-x86_64.flatpak" "LinTO-Live-$VERSION-x86_64.AppImage"; do
            test -f "$f" || { echo "missing $f" >&2; exit 1; }
          done
          sha256sum LinTO-Live-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          # Changes since the last published release (versions tagged but never released included).
          # This tag's own release is skipped: it may already exist (uploaded by hand, or a rerun).
          previous="$(gh release list --exclude-drafts --exclude-pre-releases --json tagName \
            -q "[.[] | select(.tagName != \"$TAG\")][0].tagName" 2>/dev/null || true)"
          bash scripts/release-notes.sh "$VERSION" "${previous#v}" > release-notes.md
          cat release-notes.md

      - name: Publish release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "LinTO Live $VERSION" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" release/* --title "LinTO Live $VERSION" --notes-file release-notes.md --latest --verify-tag
          fi
