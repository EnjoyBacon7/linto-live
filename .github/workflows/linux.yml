name: Build

# Every push / PR: Linux packages (AppImage, .deb, Flatpak) + macOS typecheck and tests.
# Tags v*: also the macOS dmg, then a GitHub release with all four packages, SHA256SUMS.txt and the
# notes from CHANGELOG.md (scripts/release-notes.sh).

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with OBS_VERSION in scripts/build-obs-linux.sh (part of the cache key).
  OBS_VERSION: '32.1.0'
  # Keep in sync with flatpak.runtimeVersion / baseVersion in electron-builder.yml.
  FLATPAK_RUNTIME: '25.08'

jobs:
  linux:
    name: Linux packages (ubuntu-24.04, x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # The OBS build (~30-45 min) only reruns when the OBS tag or the build script changes.
      - name: Restore OBS build cache
        id: obs-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/obs/linux
          key: obs-linux-${{ env.OBS_VERSION }}-ubuntu-24.04-x64-${{ hashFiles('scripts/build-obs-linux.sh', 'scripts/obs-linux-patches/**') }}

      # Needed by the OBS build and by the Flatpak build (several copies of the app tree).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build OBS ${{ env.OBS_VERSION }} from source
        if: steps.obs-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-obs-linux.sh

      - name: Remove OBS build intermediates
        if: steps.obs-cache.outputs.cache-hit != 'true'
        run: rm -rf vendor/cache

      # Saved right away so a later failure (tests, packaging) does not throw the OBS build away.
      - name: Save OBS build cache
        if: steps.obs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor/obs/linux
          key: ${{ steps.obs-cache.outputs.cache-primary-key }}

      - name: Check staged OBS tree
        run: |
          test -x vendor/obs/linux/obs/bin/obs
          test -f vendor/obs/linux/obs/COPYING
          test -f vendor/obs/linux/obs/lib/obs-plugins/obs-browser.so
          test -f vendor/obs/linux/obs/lib/obs-plugins/obs-websocket.so
          cat vendor/obs/linux/obs/BUILD-INFO.txt
          du -sh vendor/obs/linux/obs

      - name: Install Flatpak tooling and runtimes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            "org.freedesktop.Platform//$FLATPAK_RUNTIME" \
            "org.freedesktop.Sdk//$FLATPAK_RUNTIME" \
            "org.electronjs.Electron2.BaseApp//$FLATPAK_RUNTIME"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure the Electron binary is present
        run: test -x node_modules/electron/dist/electron || node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build AppImage + .deb + Flatpak
        run: DEBUG=@malept/flatpak-bundler npm run dist:linux

      # The bundled OBS leaves host libraries (libva, PulseAudio, EGL/GL, ...) to the system; the
      # .deb declares them. Installing it with apt pulls them in, so `ldd` checks both the OBS tree
      # and the package's Depends list.
      - name: Install and inspect .deb
        run: |
          set -euo pipefail
          deb="$(ls dist/*.deb)"
          dpkg-deb --info "$deb"
          # Listed to a file: grep -q on the pipe would stop early and fail dpkg-deb under pipefail.
          dpkg-deb --contents "$deb" > /tmp/deb-contents.txt
          grep 'resources/obs/bin/obs$' /tmp/deb-contents.txt
          sudo apt-get install -y --no-install-recommends "./$deb"
          obs="/opt/LinTO Live/resources/obs/bin/obs"
          test -x "$obs"
          if ldd "$obs" | grep 'not found'; then exit 1; fi
          echo "OBS_INSTALLED=$obs" >> "$GITHUB_ENV"

      - name: Inspect AppImage
        run: |
          set -euo pipefail
          appimage="$(ls dist/*.AppImage)"
          echo "AppImage: $appimage ($(du -h "$appimage" | cut -f1))"
          rm -rf /tmp/appimage && mkdir -p /tmp/appimage && cd /tmp/appimage
          "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          obs=/tmp/appimage/squashfs-root/resources/obs/bin/obs
          test -x "$obs"
          test -f /tmp/appimage/squashfs-root/resources/obs/COPYING
          test -f /tmp/appimage/squashfs-root/resources/obs/SOURCE.md
          if ldd "$obs" | grep 'not found'; then exit 1; fi

      # Every library the bundled OBS and its plugins link against must resolve inside the sandbox
      # (bundled tree + Freedesktop runtime).
      - name: Install and inspect Flatpak
        run: |
          set -euo pipefail
          bundle="$(ls dist/*.flatpak)"
          echo "Flatpak: $bundle ($(du -h "$bundle" | cut -f1))"
          flatpak install --user -y --noninteractive --bundle "$bundle"
          flatpak info --user ai.linto.live
          flatpak info --user --show-permissions ai.linto.live
          flatpak run --command=sh ai.linto.live -c '
            set -eu
            cd /app/lib/ai.linto.live/resources/obs
            test -x bin/obs && test -f COPYING && test -f SOURCE.md
            missing=0
            for f in bin/obs lib/obs-plugins/*.so; do
              if ldd "$f" | grep "not found"; then echo "^ in $f"; missing=1; fi
            done
            exit $missing
          '

      # Best-effort smoke test: start/stop the bundled OBS under Xvfb (software GL) through the
      # real ObsProcess, isolated config. Informational only: CI has no GPU, audio or camera.
      - name: Smoke test bundled OBS (Xvfb)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
          LINTO_LIVE_IT=1 LINTO_LIVE_OBS="$OBS_INSTALLED" \
            xvfb-run -a -s '-screen 0 1920x1080x24' \
            npx vitest run --config vitest.it.config.ts tests/integration/obs-process.it.test.ts

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: LinTO-Live-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.flatpak
          if-no-files-found: error

  macos:
    name: macOS (macos-15, arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Fetch official OBS ${{ env.OBS_VERSION }} for macOS
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: npm run fetch:obs:mac

      - name: Build dmg
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: npm run dist:mac

      - name: Inspect dmg
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          app="dist/mac-arm64/LinTO Live.app"
          test -d "$app/Contents/Resources/obs/OBS.app"
          codesign --verify --deep --strict "$app/Contents/Resources/obs/OBS.app"
          hdiutil verify dist/*.dmg
          ls -la dist/*.dmg

      - name: Upload dmg
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: LinTO-Live-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "v$version" = "$TAG" || { echo "Tag $TAG does not match package.json version $version" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums and notes
        run: |
          set -euo pipefail
          cd release
          for f in "LinTO-Live-$VERSION-arm64.dmg" "LinTO-Live-$VERSION-amd64.deb" \
                   "LinTO-Live-$VERSION-x86_64.flatpak" "LinTO-Live-$VERSION-x86_64.AppImage"; do
            test -f "$f" || { echo "missing $f" >&2; exit 1; }
          done
          sha256sum LinTO-Live-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          # Changes since the last published release (versions tagged but never released included).
          previous="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          bash scripts/release-notes.sh "$VERSION" "${previous#v}" > release-notes.md
          cat release-notes.md

      - name: Publish release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "LinTO Live $VERSION" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" release/* --title "LinTO Live $VERSION" --notes-file release-notes.md --latest --verify-tag
          fi
