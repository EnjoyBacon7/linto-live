appId: ai.linto.live
productName: LinTO Live
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - out/main/overlay-page/**
# Hardened Electron binary (flipped before signing): no Node mode, NODE_OPTIONS or --inspect for anyone
# who can launch the app, encrypted cookies, only the integrity-checked app.asar is loaded, and file://
# pages get no privileges beyond a browser's.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
# Shared by every platform; each platform adds its own OBS build below (merged by electron-builder),
# so a package only ever ships the OBS for its own OS.
extraResources:
  - from: resources/obs/SOURCE.md
    to: obs/SOURCE.md
  # Menu-bar / tray icons (scripts/make-tray-icons.mjs), loaded from process.resourcesPath/tray.
  - from: resources/tray
    to: tray
    filter:
      - '*.png'
mac:
  extraResources:
    - from: vendor/obs/macos
      to: obs
      filter:
        - OBS.app/**
        - COPYING
  target:
    - target: dmg
      arch: arm64
    - target: dir
      arch: arm64
  category: public.app-category.video
  # Ad-hoc signature for the Electron app (arm64 refuses unsigned code); personal use, no notarization.
  identity: '-'
  hardenedRuntime: false
  # Never re-sign the embedded official OBS.app: it keeps its Wizards of OBS LLC signature.
  signIgnore:
    - '/Contents/Resources/obs/'
  extendInfo:
    NSCameraUsageDescription: LinTO Live utilise la carte de capture ou la caméra pour afficher la vidéo de la salle.
    NSMicrophoneUsageDescription: LinTO Live envoie le son du micro choisi à LinTO pour la transcription en direct.
dmg:
  artifactName: LinTO-Live-${version}-arm64.${ext}
linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
    - target: flatpak
      arch: x64
  maintainer: EnjoyBacon7 <59032058+EnjoyBacon7@users.noreply.github.com>
  category: AudioVideo
  synopsis: LinTO live captions over a hidden OBS
  # linto-live.desktop (package.json desktopName) with StartupWMClass=linto-live, the window class
  # Electron sets: docks/taskbars attach the running window to the launcher entry and its icon.
  syncDesktopName: true
  # OBS 32.1 built from source by scripts/build-obs-linux.sh: bin/obs, lib/, share/obs/, COPYING.
  extraResources:
    - from: vendor/obs/linux/obs
      to: obs
    # Window icon (BrowserWindow `icon`): X11 taskbars and Alt-Tab read it from the window.
    - from: build/icon.png
      to: icon.png
appImage:
  artifactName: LinTO-Live-${version}-x86_64.${ext}
# Single-file bundle (flatpak install --user ./LinTO-Live-<version>-x86_64.flatpak), any distribution
# with Flatpak. The bundled OBS's host libraries (libva, PulseAudio, PipeWire, EGL/GL, ...) come from
# the Freedesktop runtime, which is fetched from Flathub at install time. OBS's CEF runs without its
# own sandbox (obs-browser: no_sandbox on Linux), so nothing beyond these permissions is needed.
flatpak:
  artifactName: LinTO-Live-${version}-x86_64.${ext}
  runtime: org.freedesktop.Platform
  runtimeVersion: '25.08'
  sdk: org.freedesktop.Sdk
  base: org.electronjs.Electron2.BaseApp
  baseVersion: '25.08'
  finishArgs:
    - --share=ipc
    - --share=network
    # The bundled OBS always runs on X11 (QT_QPA_PLATFORM=xcb, XWayland under Wayland).
    - --socket=x11
    - --socket=pulseaudio
    # GPU (OBS rendering, captions browser) and V4L2 cameras / capture cards.
    - --device=all
    # Transcript export anywhere the user picks.
    - --filesystem=home
    - --talk-name=org.freedesktop.Notifications
    - --talk-name=org.kde.StatusNotifierWatcher
    # safeStorage (LinTO token) through the desktop keyring.
    - --talk-name=org.freedesktop.secrets
# Installed in /opt/LinTO Live by apt (Ubuntu 24.04+, Debian 13+), which also installs the host
# libraries below: no manual step, unlike the AppImage (libfuse2). Replaces electron-builder's
# default list, so Electron's own needs come first; then what the bundled OBS (and its CEF) links
# against but deliberately does not ship (scripts/build-obs-linux.sh step 6, list from readelf
# NEEDED of every ELF in vendor/obs/linux/obs). `a | b`: t64 names (Ubuntu 24.04, Debian 13) or older.
deb:
  artifactName: LinTO-Live-${version}-amd64.${ext}
  depends:
    # Electron
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0t64 | libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    # OBS + CEF
    - libasound2t64 | libasound2
    - libatk1.0-0t64 | libatk1.0-0
    - libatk-bridge2.0-0t64 | libatk-bridge2.0-0
    - libcups2t64 | libcups2
    - libglib2.0-0t64 | libglib2.0-0
    - libdbus-1-3
    - libdrm2
    - libegl1
    - libexpat1
    - libfontconfig1
    - libfreetype6
    - libfribidi0
    - libgbm1
    - libgl1
    - libglx0
    - libopengl0
    - libgmp10
    - libgpg-error0
    - libharfbuzz0b
    - libice6
    - libsm6
    - libjack-jackd2-0 | libjack0
    - libnspr4
    - libpipewire-0.3-0t64 | libpipewire-0.3-0
    - libpulse0
    - libudev1
    - libusb-1.0-0
    - libva2
    - libva-drm2
    - libva-x11-2
    - libvdpau1
    - libwayland-client0
    - libx11-6
    - libx11-xcb1
    - libxcb1
    - libxcomposite1
    - libxdamage1
    - libcom-err2
    - zlib1g
